[list]
url = "https://localhost:{{ (repo ~ \"-ssl-\" ~ branch) | hash_port }}"

[aliases]
url = "echo https://localhost:{{ (repo ~ \"-ssl-\" ~ branch) | hash_port }}"

[step.copy-ignored]
exclude = [
  "web/mise.local.toml",
  "web/.env.*",
  "web/.iex.exs",
  "web/.port",
  "web/.port.*",
  "web/_private",
]

[[pre-start]]
env = """
printf '%s\n' \
  '# Generated by Worktrunk for this worktree.' \
  '[env]' \
  'PORT = "{{ branch | hash_port }}"' \
  'PORT_SSL = "{{ (repo ~ "-ssl-" ~ branch) | hash_port }}"' \
  'VITE_PORT_UI = "{{ (repo ~ "-ui-" ~ branch) | hash_port }}"' \
  > web/mise.local.toml
"""

[[post-start]]
copy_ignored = "wt step copy-ignored"
